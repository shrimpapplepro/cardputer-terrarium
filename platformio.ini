[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_port = /dev/cu.usbmodem101
board_upload.flash_size = 8MB
monitor_speed = 115200
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DESP32S3
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -Isim
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
  m5stack/M5Unified@^0.2.12
  m5stack/M5GFX@^0.2.15
  h2zero/NimBLE-Arduino@^1.4.2
# sim/ is compiled in place; the host harness builds the very same files.
build_src_filter =
  +<*>
  +<../sim/terrarium.cpp>
